name: Update Chart.js

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  update-chartjs:
    runs-on: ubuntu-latest
    
    # Required to allow the GITHUB_TOKEN to push changes
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for git-auto-commit-action to push changes
          persist-credentials: true

      - name: Get latest Chart.js version and download
        # Assign an ID to this step so we can access its outputs later
        id: chartjs_version
        run: |
          # 1. Fetch the latest stable version number (e.g., 4.5.1) from npm registry
          LATEST_VERSION=$(curl -s "https://registry.npmjs.org/chart.js/latest" | jq -r ".version")
          
          # 2. Make the version number available to subsequent steps (the commit message)
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest Chart.js version found: $LATEST_VERSION"
          
          # 3. Create directory and download the file using the DYNAMIC version
          mkdir -p static/js
          curl -L "https://cdn.jsdelivr.net/npm/chart.js@$LATEST_VERSION/dist/chart.umd.js" -o static/js/chart.umd.js
        # Note: This requires the 'jq' utility, which is generally pre-installed on 'ubuntu-latest'.

      - name: Commit & push if changed
        # This action automatically handles git configuration and the no-change check.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Use the dynamic version output from the previous step in the commit message
          commit_message: "Update Chart.js to ${{ steps.chartjs_version.outputs.latest_version }}"
          # Corrected input name
          file_pattern: static/js/chart.umd.js
