name: Update Chart.js

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  update-chartjs:
    runs-on: ubuntu-latest
    
    # --- 🔑 FIX 2: Add WRITE permissions for the GITHUB_TOKEN ---
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download latest chart.umd.js
        run: |
          mkdir -p static/js
          # Note: I'm keeping your hardcoded version for now, 
          # but consider making this dynamic as previously recommended.
          curl -L https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js -o static/js/chart.umd.js

      - name: Commit & push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Chart.js to 4.5.0"
          # --- 🛠️ FIX 1: Changed 'files' to 'file_pattern' ---
          file_pattern: static/js/chart.umd.js 
          # Note: The GITHUB_TOKEN is automatically used by the action 
          # and no longer needs to be explicitly passed in the `env:` block 
          # when using the `permissions:` block above.
