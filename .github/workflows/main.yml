name: Update Chart.js

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  update-chartjs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download latest chart.umd.js
        run: |
          mkdir -p static/js
          curl -L https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js -o static/js/chart.umd.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/js/chart.umd.js
          if ! git diff --cached --quiet; then
            git commit -m "Update Chart.js to 4.5.0"
            git push
          else
            echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
